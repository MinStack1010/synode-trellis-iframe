server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 50m;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json model/gltf+json;
  gzip_min_length 1024;
  gzip_comp_level 6;


  location /trellis-api/ {
    proxy_pass http://34.42.10.21:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 30s;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    proxy_buffering on;
    proxy_buffer_size 128k;
    proxy_buffers 64 256k;
    proxy_busy_buffers_size 512k;
    proxy_max_temp_file_size 64m;
  }

  location /_nuxt/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ $uri/index.html /200.html /index.html;
  }
}
