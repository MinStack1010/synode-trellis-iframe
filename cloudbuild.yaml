steps:
  - name: node:20
    entrypoint: npm
    args: ["ci"]

  - name: node:20
    entrypoint: npm
    args: ["run", "generate"]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - storage
      - rsync
      - --recursive
      - --delete-unmatched-destination-objects
      - dist
      - gs://${_BUCKET_NAME}

substitutions:
  _BUCKET_NAME: synode-trellis-iframe

options:
  logging: CLOUD_LOGGING_ONLY
